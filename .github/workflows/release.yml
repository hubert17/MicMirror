name: CI/CD & DMG Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    name: Build & Package DMG (macOS arm64)
    runs-on: macos-latest # Apple Silicon (M-series) runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Code Quality Checks (CI)
        run: |
          cargo fmt --check || echo "Formatting check completed"
          cargo clippy --release -- -D warnings

      - name: Install DMG packaging tool
        run: |
          brew install create-dmg || true

      - name: Build App & Generate DMG (CD)
        run: |
          chmod +x scripts/build_app.sh scripts/create_dmg.sh
          ./scripts/create_dmg.sh

      - name: Generate Checksums
        run: |
          cd target/release
          shasum -a 256 MicMirror-macos-arm64.dmg > MicMirror-macos-arm64.dmg.sha256
          cat MicMirror-macos-arm64.dmg.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicMirror-macos-arm64-installer
          path: |
            target/release/MicMirror-macos-arm64.dmg
            target/release/MicMirror-macos-arm64.dmg.sha256

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MicMirror ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/MicMirror-macos-arm64.dmg
            target/release/MicMirror-macos-arm64.dmg.sha256
