name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build & Package macOS (Apple Silicon)
    runs-on: macos-14 # macOS 14 is Apple Silicon (M1/M2/M3 runners on GitHub Actions)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release app bundle
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create Release Zip & Checksums
        run: |
          cd target/release
          # Create zip preserving symlinks and app permissions
          ditto -c -k --sequesterRsrc --keepParent MicMirror.app MicMirror-macos-arm64.zip
          shasum -a 256 MicMirror-macos-arm64.zip > MicMirror-macos-arm64.zip.sha256
          cat MicMirror-macos-arm64.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicMirror-macos-arm64
          path: |
            target/release/MicMirror-macos-arm64.zip
            target/release/MicMirror-macos-arm64.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MicMirror ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/MicMirror-macos-arm64.zip
            target/release/MicMirror-macos-arm64.zip.sha256
