[package]
name = "micmirror"
version = "0.1.0"
edition = "2021"
authors = ["MicMirror Contributors"]
description = "Ultra-low latency real-time microphone sidetone for Apple Silicon 3.5mm headphones"
readme = "README.md"

[dependencies]
cpal = "0.15"
rtrb = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
